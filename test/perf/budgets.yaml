budgets:
  - name: binary_size
    unit: bytes
    max: 41943040        # 40 MiB
  - name: cli_startup
    unit: ms
    max: 50
  - name: iso_size
    unit: bytes
    max: 1610612736      # 1.5 GiB (G1.1; raised from 1.2 GiB — linux-firmware + offline nixpkgs channel dominate)
  - name: install_footprint
    unit: bytes
    max: 6442450944      # 6 GiB (G1.7)
  - name: boot_time_ms
    unit: ms
    max: 90000           # 90 s median (G1.4)
  - name: agent_idle_rss_bytes
    unit: bytes
    max: 125829120       # 120 MB (G2.11)
  - name: agent_idle_cpu_percent
    unit: percent
    max: 2               # of one core (G2.11)
  - name: reconcile_tick_p99_ms
    unit: ms
    max: 500             # with 20 resources (G2.11)
  - name: raft_write_p99_ms
    unit: ms
    max: 200             # p99 of 1000 sequential writes, 3 nodes (G3 perf)
  - name: raft_read_linear_p99_ms
    unit: ms
    max: 50              # p99 of 10k barrier reads (G3 perf)
  - name: raft_read_stale_p99_ms
    unit: ms
    max: 5               # p99 of 10k stale reads (G3 perf)
  - name: cluster_form_3node_s
    unit: s
    max: 30              # t0 → all three nodes report a leader
  - name: leader_election_p99_ms
    unit: ms
    max: 5000            # p99 across kill-leader rounds
  - name: raft_snapshot_100k_s
    unit: s
    max: 60              # forced raft snapshot over 100k keys
  - name: raft_restore_100k_s
    unit: s
    max: 60              # fresh node restored via InstallSnapshot
  - name: schedule_100x3_ms
    unit: ms
    max: 500              # 100 blocks x 3 replicas on 10 simulated nodes (G4.4)
  - name: block_deploy_p99_s
    unit: s
    max: 10               # spec accepted -> RUNNING, cached closure (G4.5)
  - name: agent_rss_per_block_bytes
    unit: bytes
    max: 1048576          # <= 1 MiB resident overhead per block
  - name: block_list_500_ms
    unit: ms
    max: 100              # List over 500 blocks in the store
  # Phase 05 network budgets (§6). lb_rps is a MINIMUM (floor); the
  # rest are ceilings. proxy_rss_bytes and vip_failover_ms are
  # VM-measured (net-vip-failover / agent tests) — CheckAll leaves
  # them unmeasured (-1).
  - name: lb_rps
    unit: rps
    min: 20000           # wrk -t4 -c100 -d30s through the L7 LB, 3 replicas
  - name: lb_added_latency_p99_us
    unit: us
    max: 1000            # p99 through the LB minus direct-to-backend p99
  - name: proxy_rss_bytes
    unit: bytes
    max: 31457280        # expanse-proxy RSS under 100 concurrent connections (G5.14, VM-only)
  - name: vip_failover_ms
    unit: ms
    max: 5000            # lease loss → new holder announcing (VM-only; net-vip-failover)
  - name: dns_query_p99_us
    unit: us
    max: 1000            # 10k authoritative queries, p99
  - name: l4_throughput_ratio
    unit: ratio
    min: 0.8             # L4 proxy throughput vs direct loopback (iperf3 stand-in)
  # Phase 06 storage budgets (§5 perf tests). All VM-measured by
  # nix/tests/vol-perf.nix on a real ZFS pool — CheckAll leaves them
  # unmeasured (-1). Ratios are exvol R=3 over a raw local zvol with the
  # same properties on the same VM. The ratios and vol_resync_mbps are
  # floors; exvol_fsync_p99_us and vol_failover_ms are ceilings.
  - name: exvol_seqwrite_ratio
    unit: ratio
    min: 0.75            # seq write 1M qd=32 (G6.8)
  - name: exvol_seqread_ratio
    unit: ratio
    min: 0.95            # seq read 1M qd=32 (reads are local)
  - name: exvol_randwrite_ratio
    unit: ratio
    min: 0.60            # rand write 4k qd=64 (G6.9)
  - name: exvol_randread_ratio
    unit: ratio
    min: 0.95            # rand read 4k qd=64
  - name: exvol_fsync_p99_us
    unit: us
    max: 20000           # absolute ceiling; the test also enforces <= 2x local + 1 RTT
  - name: vol_failover_ms
    unit: ms
    max: 20000           # primary hard-crash -> next successful write (G6.4)
  - name: vol_resync_mbps
    unit: MiB/s
    min: 1.7             # floor from G6.7: 100 MiB of drift within 60 s
