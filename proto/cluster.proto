syntax = "proto3";

package expanse.cluster.v1;

import "proto/store.proto";

option go_package = "github.com/expanse/expanse/proto";

// InternalStoreService is the node-to-node write-forwarding RPC (§4.1
// "Write forwarding"): a follower that receives a write forwards the
// encoded store Command to the leader, which applies it through Raft and
// returns the committed revision. The command bytes are the same wire
// format the Raft log uses, so no re-encoding happens mid-cluster.
service InternalStoreService {
  // ForwardCommand: follower → leader write forwarding (§4.1).
  rpc ForwardCommand(expanse.store.v1.Command) returns (ForwardCommandResponse);
  // LinearRead: follower → leader read forwarding. raft.Barrier only
  // works on the leader, so a follower serving a linearizable read
  // forwards it (same pattern as Consul's consistent reads).
  rpc LinearRead(LinearReadRequest) returns (LinearReadResponse);
  // RemoveServer / TransferLeadership: follower → leader forwarding of
  // raft membership changes, which only the leader can apply.
  rpc RemoveServer(RemoveServerRequest) returns (MembershipResponse);
  rpc TransferLeadership(LeadershipTransferRequest) returns (MembershipResponse);
}

message RemoveServerRequest {
  string id = 1;
}

// An empty `to` lets raft pick the most up-to-date follower.
message LeadershipTransferRequest {
  string to = 1;
}

message MembershipResponse {
  ErrorDetail error = 1;
}

message LinearReadRequest {
  oneof query {
    string get_key = 1;
    string list_prefix = 2;
    bool revision_only = 3;
  }
}

message LinearReadResponse {
  oneof result {
    Entry entry = 1;
    EntryList list = 2;
    uint64 revision = 3;
    ErrorDetail error = 4;
  }
}

message Entry {
  string key = 1;
  bytes value = 2;
  uint64 revision = 3;
  int64 created_at_unix_ns = 4;
  int64 updated_at_unix_ns = 5;
}

message EntryList {
  repeated Entry entries = 1;
}

message ForwardCommandResponse {
  oneof result {
    // Revision of the committed state after the command applied.
    uint64 revision = 1;
    // The typed error from the leader's apply (kind/op/message of
    // internal/errors.Error), so client-side error semantics are
    // identical whether a write ran locally or was forwarded.
    ErrorDetail error = 2;
  }
}

// ErrorDetail mirrors internal/errors.Error for cross-node transport.
message ErrorDetail {
  string kind = 1;
  string op = 2;
  string message = 3;
}

// JoinService is the bootstrap enrollment endpoint (§4.5), served on
// :7446 over TLS. The joiner has no credentials yet — authorization is
// the join token (HMAC-SHA256 keyed by the cluster secret); the cluster
// CA and secret are delivered in the response and then pinned locally.
service JoinService {
  // Join: enroll a node — verify token, sign the CSR, add the Raft
  // voter, and return the cluster material. Token consumption and the
  // /nodes/<id> record commit in one Raft txn, so two racing joins with
  // the same single-use token cannot both succeed (§10 "Join race on
  // the same token").
  rpc Join(JoinRequest) returns (JoinResponse);
}

message JoinRequest {
  string node_id = 1;        // Raft server ID / cert CN
  bytes csr = 2;             // PKCS#10 DER; CN must equal node_id
  string token = 3;          // expanse-join-… token
  string advertise_addr = 4; // Raft addr host:port the joiner binds
  string api_addr = 5;       // public API addr host:port
  string role = 6;           // voter | nonvoter | witness (§4.2)
  string inventory = 7;      // JSON capabilities/capacity (phase 04)
}

message JoinResponse {
  bytes ca_cert = 1;         // cluster CA cert, PEM
  bytes node_cert = 2;       // freshly signed node cert, PEM
  string cluster_id = 3;
  bytes cluster_secret = 4;  // 32B; HMAC key for tokens, sealed CA key
  repeated JoinPeer peers = 5;
  string raft_config = 6;    // JSON: heartbeat/election timeouts
  string leader_raft_addr = 7;
  bytes sealed_ca_key = 8;   // CA private key, age-sealed to the cluster secret (§4.4: every node can serve joins when leader)
}

message JoinPeer {
  string id = 1;
  string raft_addr = 2;
  string api_addr = 3;
  string role = 4;
}
