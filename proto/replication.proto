syntax = "proto3";

// Wire messages for the exvol replication transport (Phase 06 T05).
// These carry the §4.3 replication protocol (T04's simulator types) over
// TCP connections between volume replicas on the exp0 mesh. Versioning /
// rolling-upgrade negotiation is a later-phase concern — frames carry a
// version byte; no negotiation yet.
package expanse.replication.v1;

option go_package = "github.com/expanse/expanse/proto";

// WriteRequest is one replicated write sent from a primary to a
// secondary (§4.3 step 5). CRC is crc32c(Data), computed once at the
// primary and verified by the secondary (step 6a).
message WriteRequest {
  string vol_id = 1;
  uint64 seq = 2;
  uint64 offset = 3;
  bytes data = 4;
  uint32 crc32c = 5;
  // flush is a durability marker (§4.4: a device flush must fsync all
  // quorum replicas before returning). It consumes a sequence number
  // (keeping R2's gapless property) but carries no data.
  bool flush = 6;
}

// WriteReply is the secondary's response (§4.3 step 6e / T04 Reply).
message WriteReply {
  bool ack = 1;
  uint64 seq = 2;
  uint64 last_seq = 3;
  bool gap = 4;
  bool retransmit = 5;
  bool resync = 6;
  string reason = 7;
}

// SeqInfo is one replica's durable-op record, reported at failover
// recovery (§4.3 step 4a): the seq and the CRC it was applied under.
// Recovery compares CRCs across replicas — the same seq with different
// CRCs is a divergent branch (§9): refuse automatic recovery.
message SeqInfo {
  uint64 seq = 1;
  uint32 crc32c = 2;
}

// SeqQuery asks a replica for its last contiguous seq plus the per-seq
// CRC records (recovery step 4a).
message SeqQuery {
  string vol_id = 1;
}

message SeqQueryReply {
  string vol_id = 1;
  uint64 last_seq = 2;
  repeated SeqInfo ops = 3;
  // Live primary health (§4.6), populated only when the answering node
  // currently holds the PRIMARY role for vol_id — a raft-independent
  // probe: the CLI's `volume inspect` dials this directly (same channel
  // as recovery's own probes) so a volume's live Degraded/ReadOnly
  // state stays observable even when the cluster's raft control plane
  // has itself lost write quorum and cannot persist a status update
  // (see runtime.querySeq / cmd_volume_ops.go's liveState).
  bool is_primary = 4;
  int32 replication = 5;
  int32 healthy_replicas = 6;
}

// FetchOpsRequest pulls ops (from_seq, to_seq] from a replica — the
// recovery step 4b/4c data movement. The replica re-reads the bytes
// from its own durable copy.
message FetchOpsRequest {
  string vol_id = 1;
  uint64 from_seq = 2;
  uint64 to_seq = 3;
}

message FetchOpsReply {
  repeated WriteRequest ops = 1;
}

// SnapListReply lists a replica's local snapshot names (T12 resync:
// common-ancestor discovery).
message SnapListReply {
  repeated string names = 1;
}

// AdoptSeqRequest tells a replica its durable state now corresponds to
// seq after a resync (T12: the replica resumes inclusion in quorum at
// that seq). Full=true means the replica was rebuilt wholesale and its
// per-seq op records were reset with the image.
message AdoptSeqRequest {
  string vol_id = 1;
  uint64 seq = 2;
  bool full = 3;
}
