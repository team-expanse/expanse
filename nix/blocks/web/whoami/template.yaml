# From nix/tests/net-lb-distribution.nix's manifest.
replicas: 3
strategy:
  kind: ACTIVE_ACTIVE
resources:
  requests:
    cpu: 100m
    memory: 64Mi
placement:
  antiAffinity: ANTI_AFFINITY_NODE
network:
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: tcp
      expose: EXPOSE_VIP
  healthCheck:
    readiness:
      type: PROBE_TCP
      port: 8080
      periodSeconds: 2
