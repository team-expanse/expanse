# From docs/MARIADB.md §manifest; storage sized down to a modest default.
replicas: 1
strategy:
  kind: SINGLETON
resources:
  requests:
    cpu: 500m
    memory: 1Gi
storage:
  - name: mariadb-data
    size: 10Gi
    replication: 3
    mountPath: /var/lib/mariadb
network:
  ports:
    - name: mysql
      port: 3306
      targetPort: 13306
      protocol: tcp
      expose: EXPOSE_VIP
  healthCheck:
    readiness:
      type: PROBE_TCP
      port: 13306
      periodSeconds: 2
