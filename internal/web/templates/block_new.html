<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expanse — Deploy a block</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRFToken}}"}'>
  <header>
    <h1>Expanse</h1>
    <button hx-post="/logout">Sign out</button>
  </header>
  <main>
    <p><a href="/blocks">&larr; Blocks</a></p>
    <h2>Deploy a block</h2>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    {{if .Types}}
    <p>Available types:
      {{range .Types}}<code>{{.Name}}</code> {{end}}
    </p>
    {{end}}
    <form method="post" action="/blocks">
      <label for="manifest">block.yaml (the same document <code>expanse ctl block apply -f</code> accepts)</label><br>
      <textarea id="manifest" name="manifest" rows="16" cols="72">{{.Example}}</textarea><br>
      <button type="submit">Deploy</button>
    </form>
    <p class="node-id">Served by node <strong>{{.NodeID}}</strong>.</p>
  </main>
</body>
</html>
