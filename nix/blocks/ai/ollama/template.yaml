# From cmd/expanse-block-run runOllama; models live under /tmp. Runs on CPU, so no GPU is required.
replicas: 1
strategy:
  kind: SINGLETON
resources:
  requests:
    cpu: "2"
    memory: 4Gi
network:
  ports:
    - name: api
      port: 11434
      targetPort: 21434
      protocol: tcp
      expose: EXPOSE_VIP
  healthCheck:
    readiness:
      type: PROBE_TCP
      port: 21434
      periodSeconds: 2
