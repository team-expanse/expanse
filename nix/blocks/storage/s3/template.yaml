# From docs/S3.md's example manifest.
strategy:
  kind: SINGLETON
resources:
  requests:
    cpu: 100m
    memory: 256Mi
storage:
  - name: objects-data
    size: 100Gi
    replication: 3
    mountPath: /var/lib/s3
network:
  ports:
    - name: s3
      port: 3900
      targetPort: 13900
      protocol: tcp
      expose: EXPOSE_VIP
  healthCheck:
    readiness:
      type: PROBE_TCP
      port: 13900
      periodSeconds: 2
