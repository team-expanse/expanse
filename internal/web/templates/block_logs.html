{{define "content"}}
<div class="page-head">
  <div>
    <h1 class="page-title"><span><span class="muted">{{.Namespace}}/</span>{{.Name}}</span><span class="muted">logs</span></h1>
    <p class="page-sub">Replica #{{.Replica}}, last 50 lines then live. Lines only reach here when the replica runs on the node serving this page.</p>
  </div>
  <div class="page-actions">
    {{template "live"}}
    {{if .Replicas}}
    <form method="get" class="form-inline">
      <label class="field"><span class="field-label">Replica</span>
        <select class="input input-sm" name="replica" data-autosubmit>
          {{range .Replicas}}<option value="{{.}}"{{if eq . $.Replica}} selected{{end}}>#{{.}}</option>{{end}}
        </select>
      </label>
    </form>
    {{end}}
  </div>
</div>
<section class="card card-flush">
  <div hx-ext="sse" sse-connect="/blocks/{{.Namespace}}/{{.Name}}/logs/stream?replica={{.Replica}}">
    <pre id="log-lines" class="log-view" sse-swap="line" hx-swap="beforeend" data-autoscroll tabindex="0"></pre>
  </div>
</section>
{{end}}
