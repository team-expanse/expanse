budgets:
  - name: binary_size
    unit: bytes
    max: 41943040        # 40 MiB
  - name: cli_startup
    unit: ms
    max: 50
  - name: iso_size
    unit: bytes
    max: 1610612736      # 1.5 GiB (G1.1; raised from 1.2 GiB — linux-firmware + offline nixpkgs channel dominate)
  - name: install_footprint
    unit: bytes
    max: 6442450944      # 6 GiB (G1.7)
  - name: boot_time_ms
    unit: ms
    max: 90000           # 90 s median (G1.4)
  - name: agent_idle_rss_bytes
    unit: bytes
    max: 125829120       # 120 MB (G2.11)
  - name: agent_idle_cpu_percent
    unit: percent
    max: 2               # of one core (G2.11)
  - name: reconcile_tick_p99_ms
    unit: ms
    max: 500             # with 20 resources (G2.11)
  - name: raft_write_p99_ms
    unit: ms
    max: 200             # p99 of 1000 sequential writes, 3 nodes (G3 perf)
  - name: raft_read_linear_p99_ms
    unit: ms
    max: 50              # p99 of 10k barrier reads (G3 perf)
  - name: raft_read_stale_p99_ms
    unit: ms
    max: 5               # p99 of 10k stale reads (G3 perf)
  - name: cluster_form_3node_s
    unit: s
    max: 30              # t0 → all three nodes report a leader
  - name: leader_election_p99_ms
    unit: ms
    max: 5000            # p99 across kill-leader rounds
  - name: raft_snapshot_100k_s
    unit: s
    max: 60              # forced raft snapshot over 100k keys
  - name: raft_restore_100k_s
    unit: s
    max: 60              # fresh node restored via InstallSnapshot
  - name: schedule_100x3_ms
    unit: ms
    max: 500              # 100 blocks x 3 replicas on 10 simulated nodes (G4.4)
  - name: block_deploy_p99_s
    unit: s
    max: 10               # spec accepted -> RUNNING, cached closure (G4.5)
  - name: agent_rss_per_block_bytes
    unit: bytes
    max: 1048576          # <= 1 MiB resident overhead per block
  - name: block_list_500_ms
    unit: ms
    max: 100              # List over 500 blocks in the store
