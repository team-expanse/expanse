# From docs/OBSERVABILITY.md §5 (storage); VIP port 80 -> config port 3000.
strategy:
  kind: SINGLETON
resources:
  requests:
    cpu: 100m
    memory: 256Mi
storage:
  - name: data
    size: 1Gi
    replication: 3
    mountPath: /var/lib/grafana
network:
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: tcp
      expose: EXPOSE_VIP
  healthCheck:
    readiness:
      type: PROBE_TCP
      port: 3000
