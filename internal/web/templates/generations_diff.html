{{define "content"}}
<div class="page-head">
  <div>
    <h1 class="page-title">Generation {{.A}} → {{.B}}</h1>
    <p class="page-sub">Keys whose desired state differs between the two snapshots.</p>
  </div>
  <div class="page-actions">
    <a class="btn btn-ghost" href="/generations/{{.A}}">View {{.A}}</a>
    <a class="btn btn-ghost" href="/generations/{{.B}}">View {{.B}}</a>
  </div>
</div>
{{template "generation-change" .}}
{{end}}
