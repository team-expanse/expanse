<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expanse — Volumes</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRFToken}}"}'>
  <header>
    <h1>Expanse</h1>
    <button hx-post="/logout">Sign out</button>
  </header>
  <main>
    <p><a href="/">&larr; Home</a></p>
    <h2>Volumes</h2>
    <p><a href="/volumes/new">Create a volume</a></p>
    <table>
      <thead>
        <tr><th>Name</th><th>Size</th><th>Replication</th><th>State</th><th>Primary</th></tr>
      </thead>
      <tbody>
        {{range .Volumes}}
        <tr>
          <td><a href="/volumes/{{.Name}}">{{.Name}}</a></td>
          <td>{{.Size}}</td>
          <td>{{.ReplicaSummary}}</td>
          <td>{{.State}}</td>
          <td>{{.Primary}}</td>
        </tr>
        {{else}}
        <tr><td colspan="5">No volumes yet.</td></tr>
        {{end}}
      </tbody>
    </table>
    <p class="node-id">Served by node <strong>{{.NodeID}}</strong>.</p>
  </main>
</body>
</html>
