# From docs/VAULTWARDEN.md example manifest.
strategy:
  kind: SINGLETON
resources:
  requests:
    cpu: 200m
    memory: 128Mi
storage:
  - name: vaultwarden-data
    size: 2Gi
    replication: 3
    mountPath: /var/lib/vaultwarden
network:
  ports:
    - name: http
      port: 80
      targetPort: 18000
      protocol: tcp
      expose: EXPOSE_VIP
  healthCheck:
    readiness:
      type: PROBE_TCP
      port: 18000
