# From docs/HAPROXY.md: VIP port 80 -> a frontend listening on 18080 (config.frontends[].port).
replicas: 2
strategy:
  kind: ACTIVE_ACTIVE
placement:
  antiAffinity: ANTI_AFFINITY_NODE
resources:
  requests:
    cpu: 100m
    memory: 64Mi
network:
  ports:
    - name: http
      port: 80
      targetPort: 18080
      protocol: tcp
      expose: EXPOSE_VIP
  healthCheck:
    readiness:
      type: PROBE_TCP
      port: 18080
